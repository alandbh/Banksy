[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "banksy-cli"
version = "0.1.0"
description = "Auto-blur sensitive information in videos and images"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "banksy" }]
keywords = ["redaction", "privacy", "blur", "video", "image", "ocr"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "typer>=0.9.0",
    "opencv-python>=4.8.0",
    "easyocr>=1.7.0",
    "google-genai>=1.0.0",
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "certifi>=2024.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
banksy = "banksy_cli.cli:app"

[project.urls]
Repository = "https://github.com/example/banksy-cli"

[tool.hatch.build.targets.wheel]
packages = ["src/banksy_cli"]

[tool.pytest.ini_options]
pythonpath = ["src"]
